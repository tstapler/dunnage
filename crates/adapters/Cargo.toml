[package]
name = "dunnage-adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = ["dunnage-core/test-support"]

[[bin]]
name = "dc-sigprobe"
path = "src/bin/dc-sigprobe.rs"
required-features = ["test-support"]

[dependencies]
dunnage-core = { path = "../core" }
dunnage-scan = { path = "../scan" }
rustix.workspace = true
libc.workspace = true
toml.workspace = true
steamlocate = "2.1"
thiserror.workspace = true
sha2 = "0.11.1"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
dunnage-adapters = { path = ".", features = ["test-support"] }
tempfile = "3"
proptest = "1"
# a safe counting allocator for the lister's memory bound; check-token-sites.sh forbids `unsafe` in tests
peak_alloc = "0.3"
