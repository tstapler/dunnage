[package]
name = "disk-cleanup-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"

[lints]
workspace = true

# Containment (ADR-005): scripts/check-tui-deps.sh holds this list. The crate has no filesystem, process or
# deletion dependency; everything it shows or does arrives through `disk-cleanup-core` ports.
[dependencies]
disk-cleanup-core = { path = "../core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
unicode-width = "0.2"

[dev-dependencies]
disk-cleanup-core = { path = "../core", features = ["test-support"] }
# Only the probe example needs a real signal source; the library may not depend on it (scripts/check-tui-deps.sh).
disk-cleanup-adapters = { path = "../adapters", features = ["test-support"] }
insta = "1"
proptest = "1"
expectrl = "0.7"

[[example]]
name = "guard_probe"
