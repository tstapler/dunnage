[package]
name = "disk-cleanup"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "disk_cleanup_cli"
path = "src/lib.rs"

[[bin]]
name = "disk-cleanup"
path = "src/main.rs"

[features]
# `disk-cleanup explore`; off, the subcommand exits 64 with "'explore' is not available in this build".
default = ["explore"]
explore = ["dep:disk-cleanup-tui"]

[dependencies]
disk-cleanup-tui = { path = "../tui", optional = true }
disk-cleanup-core = { path = "../core" }
disk-cleanup-scan = { path = "../scan" }
disk-cleanup-adapters = { path = "../adapters" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix = { workspace = true, features = ["termios"] }

[dev-dependencies]
tempfile = "3"
disk-cleanup-core = { path = "../core", features = ["test-support"] }
disk-cleanup-adapters = { path = "../adapters", features = ["test-support"] }
