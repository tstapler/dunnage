[package]
name = "dunnage"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "dunnage_cli"
path = "src/lib.rs"

[[bin]]
name = "dunnage"
path = "src/main.rs"

[features]
# `dunnage explore`; off, the subcommand exits 64 with "'explore' is not available in this build".
# The shipped binary registers every gated apply path (owner decision 2026-11-12); `cargo build
# --no-default-features --features explore` is the build without any apply-capable kind.
default = ["explore", "gate-b", "gate-c", "gate-d"]
explore = ["dep:dunnage-tui"]
# Per-gate kind registry (Story 2.3.4): a build registers an apply-capable kind only when its gate feature is on.
# All three are on by default since 2026-11-12 (RELEASE.md: the live reviews were waived by the owner).
gate-b = []
gate-c = ["gate-b"]
gate-d = ["gate-c"]

[dependencies]
dunnage-tui = { path = "../tui", optional = true }
dunnage-core = { path = "../core" }
dunnage-scan = { path = "../scan" }
dunnage-adapters = { path = "../adapters" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix = { workspace = true, features = ["termios"] }

[dev-dependencies]
tempfile = "3"
expectrl = "0.7"
dunnage-core = { path = "../core", features = ["test-support"] }
dunnage-adapters = { path = "../adapters", features = ["test-support"] }
