name: Bug report
description: Something did not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If a deletion happened outside what the dry run showed, do not file it here: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `dunnage --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and filesystem
      description: For example "Linux x86_64, btrfs" or "macOS arm64, apfs"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command line and its output (paste as text, not a screenshot)
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
