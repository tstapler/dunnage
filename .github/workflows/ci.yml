# PR/push gate (ADR-008): Bazel builds, lints and tests; the repo-level checks and the Cargo leg run beside it.
# The release workflow is separate (RELEASE.md). Matrix and runner labels: Story 5.3.2.
#
# Remote cache: off. To try the self-hosted bazel-cache-proxy (github.com/tstapler/bazel-cache-proxy), add
# `--remote_cache=<url>` (and `--noremote_upload_local_results` on pull requests) to the `build:ci` lines of .bazelrc.ci, with the
# credentials from repository secrets; nothing in this file names a host.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # setup-bazel owns the output base and the caches here, so scripts/bazel.sh passes arguments through unchanged.
  DC_BAZEL_PLAIN: "1"

jobs:
  bazel:
    name: bazel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1 # rust-toolchain.toml; the tests tagged requires-cargo run cargo
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          disk-cache: ${{ matrix.os }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: tools for the tests that trace, sandbox and quote for zsh (named skips otherwise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace jq zsh
          # Ubuntu 24.04 restricts unprivileged user namespaces; the unshare -rm tests would skip by name.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: ast-grep (the token-site and unlink checks run inside the safety tests)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo npm install -g @ast-grep/cli@0.44.0; else npm install -g @ast-grep/cli@0.44.0; fi
          ast-grep --version
      - name: repo root for the tests that run the repo-level scripts
        run: echo "DC_REPO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: build
        run: bazel build --config=ci //...
      - name: "test (default build: every apply-capable kind is registered)"
        run: bazel test --config=ci --test_env=GATE=D //...
      - name: "test (nogate build, registers no apply-capable kind)"
        run: bazel test --config=ci --config=nogate //...
      - name: dist binary carries no test-support
        run: |
          bazel build --config=ci --config=dist //crates/cli:dunnage
          scripts/check-release-features.sh --artifact bazel-bin/crates/cli/dunnage
      - name: test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testlogs-${{ matrix.os }}
          path: bazel-testlogs/**/test.log
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          disk-cache: lint
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: rustfmt and clippy -D warnings, default and nogate registries
        run: |
          bazel build --config=ci --config=lint //...
          bazel build --config=ci --config=lint --config=nogate //...

  checks:
    name: repo checks and Cargo leg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          disk-cache: checks
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: tools for the contract and token-site checks
        run: |
          sudo apt-get install -y --no-install-recommends jq
          cargo install ast-grep --locked --version 0.44.0
      - name: Cargo and Bazel agree
        run: |
          scripts/check-bazel-cargo-sync.sh --selftest
          scripts/check-bazel-cargo-sync.sh
      - name: core deps
        run: scripts/check-core-deps.sh
      - name: no stray unlink selftest
        run: scripts/check-no-stray-unlink.sh --selftest
      - name: no stray unlink
        run: scripts/check-no-stray-unlink.sh
      - name: contract frozen
        run: |
          base=HEAD~1
          if [ "${{ github.event_name }}" = pull_request ]; then base="origin/${{ github.base_ref }}"; fi
          scripts/check-contract-frozen.sh --base "$base"
      - name: contract-frozen selftest
        run: scripts/check-contract-frozen.sh --selftest
      - name: token sites selftest
        run: scripts/check-token-sites.sh --selftest
      - name: token sites
        run: scripts/check-token-sites.sh --expect-sites 1
      - name: release features selftests (Cargo, then Bazel)
        run: |
          scripts/check-release-features.sh --selftest
          scripts/check-release-features.sh --bazel-selftest
      - name: release features (Cargo and Bazel legs)
        run: scripts/check-release-features.sh
      - name: case table selftest
        run: scripts/check-case-table.sh --selftest
      - name: case table
        run: scripts/check-case-table.sh
      - name: test authorship selftest
        run: scripts/check-test-authorship.sh --selftest
      - name: test authorship
        run: scripts/check-test-authorship.sh
      - name: Cargo still builds and tests (the tests Bazel skips, and a release build)
        run: |
          cargo fmt --all --check
          cargo test -p dunnage --test kind_registry --test e2e_apply_caches
          cargo build --release --locked --workspace
