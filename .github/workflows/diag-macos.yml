# TEMPORARY diagnostics for the macOS fixes on ci/hosted-fixes; deleted before the PR is marked ready.
name: diag-macos
on:
  push:
    branches: [ci/hosted-fixes]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
      - name: environment
        run: |
          ulimit -n; ulimit -Hn; echo "TMPDIR=$TMPDIR"; sw_vers; which dash perl lsof zsh flock || true
          echo "caught of this shell: $(ps -o caught= -p $$)"; echo "pgid: $(ps -o pgid= -p $$)"
          ps -M -p $$ | head -3
          sleep 30 & echo "sleep caught: $(ps -o caught= -p $!)"
      - name: lsof against a process with a cwd inside
        run: |
          d=$(mktemp -d); mkdir -p "$d/app/target/debug"; real=$(cd "$d/app/target" && pwd -P)
          (cd "$d/app/target/debug" && exec sleep 60) & sleep 1
          echo "--- +D $d/app/target"; lsof -F n +D "$d/app/target"; echo "exit=$?"
          echo "--- +D $real"; lsof -F n +D "$real"; echo "exit=$?"
          echo "--- -d cwd"; lsof -a -d cwd -F pn -p $! ; true
      - name: deep chain, 10 000 levels
        run: |
          export RUST_BACKTRACE=1 CARGO_PROFILE_DEV_DEBUG=0
          for t in ten_thousand_level_nesting; do
            timeout 600 cargo test -p dunnage-adapters --test delete_adversarial -- --test-threads=1 --nocapture $t 2>&1 | tail -40 || true
          done
          timeout 600 cargo test -p dunnage-adapters --test delete_fdlimit -- --nocapture 2>&1 | tail -40 || true
        continue-on-error: true
      - name: pty close and thread count
        run: |
          export RUST_BACKTRACE=1 CARGO_PROFILE_DEV_DEBUG=0
          timeout 300 cargo test -p dunnage-tui --test pty_restore -- --nocapture a_closed_pty_master 2>&1 | tail -30 || true
          timeout 300 cargo test -p dunnage-scan --test stream_threads 2>&1 | tail -20 || true
          timeout 300 cargo test -p dunnage-adapters --test worktree_probe --test worktree_git 2>&1 | tail -40 || true
        continue-on-error: true
