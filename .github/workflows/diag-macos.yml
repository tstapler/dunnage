# TEMPORARY diagnostics for the macOS fixes on ci/hosted-fixes; deleted before the PR is marked ready.
name: diag-macos
on:
  push:
    branches: [ci/hosted-fixes]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
      - name: lsof against a process with a cwd inside
        shell: bash {0}
        run: |
          d=$(mktemp -d); mkdir -p "$d/app/target/debug"; real=$(cd "$d/app/target" && pwd -P)
          (cd "$d/app/target/debug" && exec sleep 60) & sleep 1
          for dir in "$d/app/target" "$real"; do
            echo "--- +D $dir"; lsof -F n +D "$dir" 2>err.txt; echo "exit=$? stderr-lines=$(wc -l < err.txt)"; head -3 err.txt
            echo "--- -w +D $dir"; lsof -w -F n +D "$dir" 2>/dev/null; echo "exit=$?"
            echo "--- +d $dir (one level)"; lsof -F n +d "$dir/debug" 2>/dev/null; echo "exit=$?"
            echo "--- none: +D on an unused dir"; mkdir -p "$d/idle"; lsof -F n +D "$d/idle" 2>/dev/null; echo "exit=$?"
          done
      - name: deep chain, 10 000 levels
        timeout-minutes: 20
        continue-on-error: true
        shell: bash {0}
        run: |
          export RUST_BACKTRACE=1 CARGO_PROFILE_DEV_DEBUG=0
          ulimit -n
          cargo test -p dunnage-adapters --test delete_adversarial -- --test-threads=1 --nocapture ten_thousand 2>&1 | tail -40
          cargo test -p dunnage-adapters --test delete_fdlimit -- --nocapture 2>&1 | tail -40
          cargo test -p dunnage --test explore_apply_matrix -- --test-threads=1 --nocapture a12 2>&1 | tail -30
      - name: pty close and thread count
        shell: bash {0}
        run: |
          export RUST_BACKTRACE=1 CARGO_PROFILE_DEV_DEBUG=0
          cargo test -p dunnage-tui --test pty_restore -- --nocapture a_closed_pty_master 2>&1 | tail -30 || true
          cargo test -p dunnage-scan --test stream_threads 2>&1 | tail -20 || true
          cargo test -p dunnage-adapters --test worktree_probe --test worktree_git 2>&1 | tail -40 || true
        timeout-minutes: 20
        continue-on-error: true
