# TEMPORARY diagnostics for the macOS fixes on ci/hosted-fixes; deleted before the PR is marked ready.
name: diag-macos
on:
  push:
    branches: [ci/hosted-fixes]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
      - name: repo scripts on macOS
        shell: bash {0}
        timeout-minutes: 20
        run: |
          for c in "check-token-sites.sh --selftest" "check-token-sites.sh --expect-sites 1" "check-release-features.sh --selftest" "check-no-stray-unlink.sh --selftest" "check-no-stray-unlink.sh" "check-tui-deps.sh"; do
            echo "=== $c"; scripts/$c 2>&1 | tail -12; echo "exit=${PIPESTATUS[0]}"
          done
      - name: tui pty tests
        shell: bash {0}
        timeout-minutes: 20
        run: |
          export RUST_BACKTRACE=1 CARGO_PROFILE_DEV_DEBUG=0
          cargo build -p dunnage-tui --examples 2>&1 | tail -3
          cargo test -p dunnage-tui --test pty_restore --test loop_fake -- --test-threads=1 2>&1 | grep -a "^test \|panicked\|assertion\|left\|right\|no frame\|test result" | head -60
