# release.yml is generated by `dist generate` and is overwritten on every regeneration, so shellcheck's
# style/info findings in dist's own scripts cannot be fixed there. Only those findings are ignored, only there.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:info:.*'
      - 'shellcheck reported issue in this script: SC2129:style:.*'
