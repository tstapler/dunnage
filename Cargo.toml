[workspace]
resolver = "2"
members = ["crates/cli", "crates/core", "crates/adapters"]

[workspace.package]
edition = "2021"
license = "MIT"

# Same lint set as metascope (MS/Cargo.toml) so metascope-derived code compiles cleanly.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Byte/inode counters are u64 and displayed as f64; precision loss is irrelevant at display scale.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_wrap = "allow"
implicit_hasher = "allow"
similar_names = "allow"
decimal_bitwise_operands = "allow"
ref_as_ptr = "allow"
match_same_arms = "allow"
single_match_else = "allow"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"
toml = "0.8"
# TEMPORARY until Task 0.1.2b (git rev + ignored local patch)
metascope-core = { path = "../metascope/crates/core" }

# The block `dist init` writes; check-release-features.sh builds with it.
[profile.dist]
inherits = "release"
lto = "thin"
