# Run `lefthook install` once after cloning to activate.
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    rust-clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings
    core-deps:
      glob: "{crates/core/**,**/Cargo.toml,scripts/check-core-deps.sh}"
      run: scripts/check-core-deps.sh

pre-push:
  commands:
    gate-a:
      run: make gate GATE=A
