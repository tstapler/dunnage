# cargo-dist config, written by `dist init` 0.32.0 and edited by hand. After any change here run `dist generate`
# (rewrites .github/workflows/release.yml) and commit both; `dist plan` fails when the workflow is out of date.
# No package or crate name appears in this file: dist reads them from the workspace, so the dunnage rename
# (RENAME.md) needs no edit here beyond the tap name when the Homebrew installer is enabled.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell"]
# Three targets in v0.1.0: no x86_64-apple-darwin, no musl (RELEASE.md says why).
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Enabled in Task 5.3.4a, after Gate F, the hosted-runner matrix and the crates.io rehearsal, so a tag cannot
# publish an unverified deleter. Then also run `dist generate`; the publish job needs the HOMEBREW_TAP_TOKEN secret.
# installers = ["shell", "homebrew"]
# tap = "tstapler/homebrew-tap"
# publish-jobs = ["homebrew"]
# Gates `host` on scripts/check-release-features.sh (workflow: check-release-artifacts.yml).
local-artifacts-jobs = ["./check-release-artifacts"]
install-path = "CARGO_HOME"
install-updater = false

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
